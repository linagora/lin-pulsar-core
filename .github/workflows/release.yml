name: Release

on:
  push:
    branches:
      - main

env:
  NODE_VERSION: 22.22
  PNPM_VERSION: 11.10.0

permissions:
  contents: read

jobs:
  release:
    name: Release with standard-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.set_output.outputs.release_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Run release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpx standard-version

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin main
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin --tags

      - name: Set release_created output
        id: set_output
        run: |
          TAG=$(git describe --tags --abbrev=0)
          PREV_TAG=$(git describe --tags --abbrev=0 "$(git rev-list --tags --skip=1 --max-count=1)")
          
          if [ "$TAG" != "$PREV_TAG" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [ release ]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout latest tag
        run: |
          LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          git checkout "$LATEST_TAG"

      - name: Setup Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          node-version: ${{ env.NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Build library
        run: pnpm build

      - name: Publish to npm
        run: pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_IN_VAULT }}
