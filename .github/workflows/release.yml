name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Release with standard-version
    runs-on: linagora
    container:
      image: node:22-bookworm
    permissions:
      contents: write
    outputs:
      release_created: ${{ steps.set_output.outputs.release_created }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Run release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpx standard-version

      - name: Push changes and tags
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_HEADER=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin main
          git -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" push origin --tags

      - name: Set release_created output
        id: set_output
        run: |
          TAG=$(git describe --tags --abbrev=0)
          PREV_TAG=$(git describe --tags --abbrev=0 "$(git rev-list --tags --skip=1 --max-count=1)")
          
          if [ "$TAG" != "$PREV_TAG" ]; then
            echo "release_created=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_created=false" >> "$GITHUB_OUTPUT"
          fi

  publish-npm:
    name: Publish to npm
    runs-on: linagora
    container:
      image: node:22-bookworm
    needs: [ release ]
    if: ${{ needs.release.outputs.release_created == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout latest tag
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          LATEST_TAG=$(git describe --tags "$(git rev-list --tags --max-count=1)")
          git checkout "$LATEST_TAG"

      - name: Install dependencies
        uses: ./.github/actions/pnpm-install

      - name: Build library
        run: pnpm build

      - name: Configure npm authentication
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN_IN_VAULT }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::NPM token is empty (secret NPM_TOKEN_IN_VAULT not available)"
            exit 1
          fi
          # User-level config: pnpm 11 ignores auth tokens from the project .npmrc
          pnpm config set "//registry.npmjs.org/:_authToken" "$NODE_AUTH_TOKEN"

      - name: Check npm authentication
        run: pnpm whoami --registry https://registry.npmjs.org/

      - name: Publish to npm
        # Trusted publishing not usable yet: package must exist on npm first and runner is self-hosted
        run: pnpm publish --access public --no-git-checks # zizmor: ignore[use-trusted-publishing]
