name: 'Install dependencies with pnpm'
description: 'Enable pnpm through corepack (version from package.json) and install dependencies. Meant to run in a node container.'

runs:
  using: 'composite'
  steps:
    - name: Install dependencies
      shell: bash
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        corepack enable
        pnpm install --frozen-lockfile
